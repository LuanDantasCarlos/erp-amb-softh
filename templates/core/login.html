{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gerenciamento Ambulatorial</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f5f9fc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 15px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            border-radius: 10px 10px 0 0 !important;
            padding: 20px 15px;
        }
        .card-header h1 {
            font-size: 24px;
            margin-bottom: 0;
        }
        .card-header .logo-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }
        .card-body {
            padding: 30px;
        }
        .btn-login {
            font-weight: 600;
            height: 45px;
        }
        .form-control {
            height: 45px;
        }
        .form-floating label {
            line-height: 1.5;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-hospital-user logo-icon"></i>
                <h1>Sistema de Gerenciamento Ambulatorial</h1>
                <p class="mb-0">Faça login para acessar o sistema</p>
            </div>
            <div class="card-body">
                {% if form.errors %}
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    Usuário ou senha incorretos. Por favor, tente novamente.
                </div>
                {% endif %}
                
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="form-floating mb-3">
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Nome de usuário" required autofocus>
                        <label for="id_username">Nome de usuário</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Senha" required>
                        <label for="id_password">Senha</label>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="fas fa-sign-in-alt me-2"></i>Entrar
                        </button>
                    </div>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
        
        <div class="text-center mt-3 text-muted">
            <small>&copy; {% now "Y" %} Sistema de Gerenciamento Ambulatorial</small>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
